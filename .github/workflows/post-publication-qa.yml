name: Scratch hosted post-publication QA

on:
  push:
    branches: [release-0.10/gnome-hosted-smoke]
    paths:
      - .github/post-publication-qa/**
      - .github/workflows/post-publication-qa.yml

permissions:
  contents: read

concurrency:
  group: scratch-post-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: startsWith(github.event.head_commit.message, 'Probe published Spectre') || startsWith(github.event.head_commit.message, 'Correct post-publication QA')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.control.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false, fetch-depth: 2}
      - id: control
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release-0.10/gnome-hosted-smoke
          changed=$(git diff-tree --no-commit-id --name-only -r HEAD)
          if grep -qx '.github/post-publication-qa/control.env' <<<"$changed"; then
            [[ "$HEAD_COMMIT_MESSAGE" == Probe\ published\ Spectre* ]]
          else
            [[ "$HEAD_COMMIT_MESSAGE" == Correct\ post-publication\ QA* ]]
            ! grep -qvE '^\.github/(post-publication-qa/|workflows/post-publication-qa\.yml$)' <<<"$changed"
          fi
          source .github/post-publication-qa/control.env
          [[ "$VERSION" == 0.9.0 || "$VERSION" == 0.10.0 ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 .github/post-publication-qa/verify_release.py --control .github/post-publication-qa/control.env --output release-identity.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: public-release-identity
          path: release-identity.json
          if-no-files-found: warn

  native:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, runner: ubuntu-24.04, asset: spectre-linuxX64.zip}
          - {arch: arm64, runner: ubuntu-24.04-arm, asset: spectre-linuxArm64.zip}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - name: Authenticate and probe the public native archive
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/download" evidence/native
          trap 'status=$?; printf "%s\n" "$status" > evidence/status.txt; exit "$status"' EXIT
          python3 .github/post-publication-qa/verify_release.py --control .github/post-publication-qa/control.env --asset '${{ matrix.asset }}' --output "$RUNNER_TEMP/download/release-and-asset.json"
          cp "$RUNNER_TEMP/download/release-and-asset.json" evidence/
          python3 .github/post-publication-qa/verify_native_archive.py --version '${{ needs.gate.outputs.version }}' --arch '${{ matrix.arch }}' --archive "$RUNNER_TEMP/download/${{ matrix.asset }}" --evidence evidence/native
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-${{ matrix.arch }}-${{ needs.gate.outputs.version }}
          path: evidence
          if-no-files-found: warn

  accessibility-acceptance:
    needs: gate
    if: needs.gate.outputs.version == '0.10.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, machine: x86_64, runner: ubuntu-24.04, asset: spectre-linuxX64.zip}
          - {arch: arm64, machine: aarch64, runner: ubuntu-24.04-arm, asset: spectre-linuxArm64.zip}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - name: Install fixture runtime before isolated acceptance session
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-x11 at-spi2-core python3 python3-gi gir1.2-gtk-3.0 \
            libatspi2.0-0 libgtk-3-0 libdbus-1-3 libdbus-1-dev \
            pipewire libpipewire-0.3-0 libpipewire-0.3-dev libspa-0.2-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Run shipped CLI against an independent visible GTK application
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/download" evidence
          trap 'status=$?; printf "%s\n" "$status" > evidence/status.txt; exit "$status"' EXIT
          test "$(uname -m)" = '${{ matrix.machine }}'
          printf '{"matrixArch":"%s","runnerMachine":"%s","asset":"%s"}\n' \
            '${{ matrix.arch }}' "$(uname -m)" '${{ matrix.asset }}' > evidence/host-identity.json
          python3 .github/post-publication-qa/verify_release.py --control .github/post-publication-qa/control.env --asset '${{ matrix.asset }}' --output "$RUNNER_TEMP/download/release.json"
          cp "$RUNNER_TEMP/download/release.json" evidence/
          python3 - "$RUNNER_TEMP/download/${{ matrix.asset }}" "$RUNNER_TEMP/cli" <<'PY'
          import pathlib,sys
          sys.path.insert(0,'.github/post-publication-qa')
          from verify_native_archive import extract_zip_preserving_unix
          extract_zip_preserving_unix(sys.argv[1],pathlib.Path(sys.argv[2]))
          PY
          spectre=$(find "$RUNNER_TEMP/cli" -type f -name spectre -perm -u+x -print -quit)
          test -f "$spectre"
          cat > "$RUNNER_TEMP/fixture.py" <<'PY'
          import gi,os,pathlib
          gi.require_version('Gtk','3.0'); from gi.repository import Gtk
          window=Gtk.Window(title='Spectre QA Window'); window.set_default_size(420,180)
          window.add(Gtk.Button(label='Spectre QA Button')); window.connect('destroy',Gtk.main_quit)
          window.show_all(); pathlib.Path(os.environ['FIXTURE_PID_FILE']).write_text(str(os.getpid())); Gtk.main()
          PY
          export FIXTURE_PID_FILE="$RUNNER_TEMP/fixture.pid"
          export SPECTRE_DAEMON_SOCKET_DIR="$RUNNER_TEMP/sp-${{ matrix.arch }}"
          mkdir -m 700 "$SPECTRE_DAEMON_SOCKET_DIR"
          dbus-run-session -- xvfb-run -a bash -euo pipefail -c '
            export NO_AT_BRIDGE=0 GTK_MODULES=gail:atk-bridge
            gsettings set org.gnome.desktop.interface toolkit-accessibility true
            /usr/bin/python3 "$1" & fixture=$!
            finish() {
              "$3" daemon stop >/dev/null 2>&1 || true
              kill "$fixture" 2>/dev/null || true
              wait "$fixture" 2>/dev/null || true
            }
            trap finish EXIT
            for i in {1..100}; do test -s "$2" && break; sleep .1; done
            pid=$(cat "$2"); test "$pid" = "$fixture"
            "$3" a11y tree --pid "$pid" > "$4"
            /usr/bin/python3 "$5" --snapshot "$4" --pid "$pid"
          ' _ "$RUNNER_TEMP/fixture.py" "$FIXTURE_PID_FILE" "$spectre" "$PWD/evidence/accessibility-fixture.json" "$PWD/.github/post-publication-qa/verify_accessibility.py"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: accessibility-fixture-${{ matrix.arch }}-${{ needs.gate.outputs.version }}
          path: evidence
          if-no-files-found: warn

  external-consumer:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21', cache: ''}
      - name: Verify Central coordinates and consume the public recording API
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/consumer-evidence"
          trap 'status=$?; printf "%s\n" "$status" > "$RUNNER_TEMP/consumer-evidence/status.txt"; exit "$status"' EXIT
          .github/post-publication-qa/verify_consumer.sh '${{ needs.gate.outputs.version }}' "$RUNNER_TEMP/consumer-evidence"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: central-consumer-${{ needs.gate.outputs.version }}
          path: ${{ runner.temp }}/consumer-evidence
          if-no-files-found: warn
