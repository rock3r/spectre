name: Release

# Tag-driven publishing pipeline (#84).
#
# Trigger: pushing a tag matching `v*` (e.g. `v0.2.0`). The `release-gate`
# job rejects anything that is not `v<semver>` before helper builds or publishing
# can start. The leading `v` is stripped from `${GITHUB_REF_NAME}` and the result
# becomes the version everywhere — the Gradle invocation is parameterised via
# `-PVERSION_NAME=...`, and `vanniktech-maven-publish`'s POMs pick up the override
# automatically.
#
# Release job graph:
#
#   0. `runtime-matrix`   — Reuses `.github/workflows/runtime-matrix.yml` (epic #215 /
#                            issue #216). Full {JBR 21, JBR 25, Temurin LTS} × OS matrix
#                            plus mixed-runtime agent attach. A red matrix blocks the
#                            release; per-PR CI stays on single-JDK Temurin 21.
#
#   1. `release-gate`     — Linux runner. Rejects non-SemVer `v*` tags, runs the
#                            full Gradle `check`, and runs `mkdocs build --strict`
#                            before any helper build or publish job starts.
#
#   2. `macos-release-artifacts` — Reuses `.github/workflows/macos-release-artifacts.yml`.
#                            Its macOS jobs build, Developer ID sign, notarize, staple, and
#                            upload the universal SCK helper and both Roast `.app` bundles.
#                            The operator-triggered pre-tag workflow uses the exact same path.
#
#   3. `linux-helpers`    — Linux runner. Cross-builds the Wayland Rust helper for
#                            both x86_64 and aarch64 using the same toolchain dance
#                            `ci.yml` documents (dpkg multi-arch + per-arch libdbus
#                            sysroot + cross-linker). Uploads the per-arch binaries
#                            as a GitHub Actions artifact.
#
#   4. `windows-helper`   — Windows runner. Builds the .NET Graphics Capture helper for
#                            x64 and arm64 and uploads both helper directories as a
#                            GitHub Actions artifact.
#
#   5. `publish`          — Linux runner. Depends on the gate and all helper jobs. Downloads
#                            the artefacts, stages them into the platform helper
#                            resource jars via `-PprebuiltMacHelperPath=...` and
#                            `-PprebuiltLinuxHelpersDir=...` and
#                            `-PprebuiltWindowsHelpersDir=...`, runs the publication-shape
#                            verification, then `publish` against the Sonatype Central
#                            Portal staging endpoint. Finally it uploads the Linux x86_64
#                            cross-targeted Roast CLI bundles to the draft GitHub release.
#
# Secrets used (all from repo settings):
#   APPLE_DEVELOPER_ID_P12 / _PASSWORD                  → reusable macOS artifact workflow
#   APPLE_SIGNING_KEYCHAIN_PASSWORD                     → reusable macOS artifact workflow
#   APPLE_DEVELOPER_IDENTITY                            → reusable macOS artifact workflow
#   APPLE_NOTARY_API_KEY / _ID / _ISSUER                → App Store Connect API auth
#   ORG_GRADLE_PROJECT_mavenCentralUsername / _Password → Central Portal token
#   ORG_GRADLE_PROJECT_signingInMemoryKey               → ASCII-armored PGP private key
#   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword       → PGP key passphrase
#
# Central Portal deployments stay in `automaticRelease=false` mode (see
# build.gradle.kts) — the maintainer manually promotes from the Central staging
# UI after verifying the artefacts. The GitHub draft release stays draft for the
# same reason. Both are intentional: the first few tagged releases want a manual
# checkpoint before they go public.

on:
  push:
    tags:
      - "v*"

# Top-level: contents read + issues write (issues needed so the `runtime-matrix` reusable
# workflow can be called without a permissions mismatch; scheduled matrix failure routing
# uses issues: write on those jobs). The `publish` job opts up to `contents: write` for
# `gh release create / upload`. Helper-build jobs only need read for checkout/artifacts.
permissions:
  contents: read
  issues: write

jobs:
  runtime-matrix:
    name: Runtime compatibility matrix
    # Explicit permissions for the reusable workflow call. Keep aligned with
    # runtime-matrix.yml job-level needs (contents + issues for scheduled-only
    # failure routing when that workflow is also used on schedule).
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/runtime-matrix.yml

  release-gate:
    name: Validate release tag
    runs-on: ubuntu-latest
    needs:
      - runtime-matrix
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Python for docs
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Derive release version from SemVer tag
        id: version
        run: |
          version="$(bash .github/scripts/derive-release-version.sh "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install libdbus + pkg-config (for spectre-wayland-helper Rust build)
        # `./gradlew check` builds the Linux Wayland helper on Linux runners. Keep the
        # release gate aligned with CI so it can exercise the same graph before any
        # helper build or publish job starts.
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Run CI gate
        run: ./gradlew check

      - name: Build docs strictly
        run: mkdocs build --strict

  macos-release-artifacts:
    name: Build signed + notarised macOS artifacts
    needs:
      - release-gate
    uses: ./.github/workflows/macos-release-artifacts.yml
    with:
      version: ${{ needs.release-gate.outputs.version }}
      ref: ${{ github.sha }}
    secrets:
      APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_SIGNING_KEYCHAIN_PASSWORD }}
      APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
      APPLE_NOTARY_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
      APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_NOTARY_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER }}

  linux-helpers:
    name: Build cross-arch Linux helpers
    runs-on: ubuntu-latest
    needs:
      - release-gate

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install libdbus + pkg-config (for spectre-wayland-helper Rust build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Enable arm64 dpkg multi-arch + install aarch64 cross-toolchain
        # Same dance as `ci.yml`: amd64-only default sources, ports.ubuntu.com source for
        # arm64, libdbus-1-dev:arm64 sysroot, gcc-aarch64-linux-gnu cross-linker.
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Architectures:/!{ /^Signed-By:/i\
          Architectures: amd64
          }' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's|^deb \([^[]\)|deb [arch=amd64] \1|' /etc/apt/sources.list
          fi
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: $codename $codename-updates $codename-backports $codename-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libdbus-1-dev:arm64

      - name: Set up Rust stable + aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build cross-arch Wayland helpers
        # `:recording:assembleWaylandHelperAllArches` writes the per-arch binaries into
        # `recording/build/generated/waylandHelper/native/linux/{x86_64,aarch64}/`.
        run: ./gradlew :recording:assembleWaylandHelperAllArches -PallLinuxArches

      - name: Upload cross-arch Linux helpers artefact
        uses: actions/upload-artifact@v4
        with:
          name: linux-helpers
          # Use a single directory `path:` so the artefact's root contains `x86_64/...`
          # and `aarch64/...` directly. With a multi-file `path:` list, upload-artifact@v4
          # would preserve the common-parent path (`recording/build/generated/...`) and the
          # download in the publish job would land under that long prefix instead of at
          # `$RUNNER_TEMP/linux-helpers/{x86_64,aarch64}/...`, breaking the
          # `-PprebuiltLinuxHelpersDir` Copy task's `include(...)` filter.
          path: recording/build/generated/waylandHelper/native/linux/
          if-no-files-found: error
          retention-days: 7

  windows-helper:
    name: Build Windows Graphics Capture helper
    runs-on: windows-latest
    needs:
      - release-gate

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Windows Graphics Capture helper
        run: ./gradlew :recording:assembleWindowsScreenshotHelper
        shell: bash

      - name: Upload Windows Graphics Capture helper artefact
        uses: actions/upload-artifact@v4
        with:
          name: windows-helper
          path: recording/build/generated/windowsScreenshotHelper/native/windows/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to Maven Central + GitHub release
    runs-on: ubuntu-latest
    needs:
      - release-gate
      - macos-release-artifacts
      - linux-helpers
      - windows-helper
    # `contents: write` needed for `gh release create / upload`; nothing else opted up.
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.release-gate.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate public API against committed baselines
        # R7 defensive depth: PR-time `check` already runs `checkKotlinAbi` via the Kotlin
        # Gradle Plugin's built-in abiValidation extension, but a tag pushed from a feature
        # branch that wasn't merged through PR review would otherwise skip the ABI check.
        # Running it here catches that path before we upload signed artefacts.
        run: ./gradlew checkKotlinAbi

      - name: Download notarised mac helper artefact
        uses: actions/download-artifact@v4
        with:
          name: mac-helper
          path: ${{ runner.temp }}/mac-helper-artifact

      - name: Extract notarised mac helper
        run: |
          mkdir -p "$RUNNER_TEMP/mac-helper"
          tar -xzf "$RUNNER_TEMP/mac-helper-artifact/SpectreCaptureHelper.app.tar.gz" \
            -C "$RUNNER_TEMP/mac-helper"
          test -x "$RUNNER_TEMP/mac-helper/SpectreCaptureHelper.app/Contents/MacOS/spectre-screencapture"

      - name: Download signed and notarised macOS CLI bundles
        uses: actions/download-artifact@v4
        with:
          name: mac-cli-bundles
          # Construo's package tasks clean their shared distribution directory. Keep the
          # notarised macOS archives outside it while packaging Linux and Windows below.
          path: ${{ runner.temp }}/mac-cli-bundles

      - name: Download cross-arch Linux helpers artefact
        uses: actions/download-artifact@v4
        with:
          name: linux-helpers
          path: ${{ runner.temp }}/linux-helpers

      - name: Download Windows Graphics Capture helper artefact
        uses: actions/download-artifact@v4
        with:
          name: windows-helper
          path: ${{ runner.temp }}/windows-helper

      - name: Verify publication shape against mavenLocal
        # Belt-and-braces: publishes everything to mavenLocal first with the prebuilt
        # helpers staged, then asserts the artefact set (per-module jar + sources jar +
        # javadoc jar + POM + module file; platform helper jars carry the native helpers)
        # before we sign and upload to Central. A failure here means the Central upload
        # would have published something incomplete — better to catch it before the
        # remote staging repo gets a partial deployment.
        run: |
          ./gradlew verifyMavenLocalPublication \
            -PVERSION_NAME="$RELEASE_VERSION" \
            -PprebuiltMacHelperPath="$RUNNER_TEMP/mac-helper/SpectreCaptureHelper.app" \
            -PprebuiltLinuxHelpersDir="$RUNNER_TEMP/linux-helpers" \
            -PprebuiltWindowsHelpersDir="$RUNNER_TEMP/windows-helper"

      - name: Build version-stamped cross-targeted CLI distributions
        run: |
          ./gradlew \
            :cli:packageLinuxX64 \
            :cli:packageLinuxArm64 \
            :cli:packageWindowsX64 \
            -PVERSION_NAME="$RELEASE_VERSION" \
            -PprebuiltMacHelperPath="$RUNNER_TEMP/mac-helper/SpectreCaptureHelper.app" \
            -PprebuiltLinuxHelpersDir="$RUNNER_TEMP/linux-helpers" \
            -PprebuiltWindowsHelpersDir="$RUNNER_TEMP/windows-helper"

      - name: Publish signed artefacts to Sonatype Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          test -n "$ORG_GRADLE_PROJECT_mavenCentralUsername"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralPassword"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword"
          ./gradlew \
            :core:publishToMavenCentral \
            :input-coordinator:publishToMavenCentral \
            :input-coordinator-server:publishToMavenCentral \
            :server:publishToMavenCentral \
            :recording:publishToMavenCentral \
            :recording-macos:publishToMavenCentral \
            :recording-linux:publishToMavenCentral \
            :recording-windows:publishToMavenCentral \
            :agent:publishToMavenCentral \
            :agent-runtime:publishToMavenCentral \
            :testing:publishToMavenCentral \
            -PVERSION_NAME="$RELEASE_VERSION" \
            -PprebuiltMacHelperPath="$RUNNER_TEMP/mac-helper/SpectreCaptureHelper.app" \
            -PprebuiltLinuxHelpersDir="$RUNNER_TEMP/linux-helpers" \
            -PprebuiltWindowsHelpersDir="$RUNNER_TEMP/windows-helper"

      - name: Create / update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            "cli/build/construo/distributions/linuxX64/spectre-linuxX64.zip" \
            "cli/build/construo/distributions/linuxArm64/spectre-linuxArm64.zip" \
            "$RUNNER_TEMP/mac-cli-bundles/spectre-macosX64.zip" \
            "$RUNNER_TEMP/mac-cli-bundles/spectre-macosArm64.zip" \
            "cli/build/construo/distributions/windowsX64/spectre-windowsX64.zip" \
            --clobber
