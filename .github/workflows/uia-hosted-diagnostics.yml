name: Windows accessibility runner diagnostics

on:
  push:
    branches: [release-0.10/uia-hosted-smoke]

permissions:
  contents: read

jobs:
  windows-helper-tests:
    name: UIA diagnostics (${{ matrix.publishMode }})
    strategy:
      fail-fast: false
      matrix:
        publishMode: [framework-dependent, bundled-windows-app-sdk]
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Apply cloud diagnostic instrumentation
        shell: pwsh
        run: |
          git apply .github/scripts/uia-hosted-diagnostic.diff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = "recording/native/windows/test-accesskit-fixture.ps1"
          (Get-Content $probe) -notmatch 'ProviderDescriptionProperty' | Set-Content $probe

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Run Windows Graphics Capture helper unit tests
        run: dotnet test recording/native/windows/SpectreWindowCapture.Tests/SpectreWindowCapture.Tests.csproj

      - name: Check out AccessKit fixture at its pinned commit
        shell: pwsh
        run: |
          $fixture = "$env:RUNNER_TEMP\accesskit-fixture"
          git init $fixture
          git -C $fixture fetch --depth 1 https://github.com/rock3r/spectre.git 96cd6cb20e44d5d26a4cfb93d8a3f8e1b6375aa8
          git -C $fixture checkout --detach FETCH_HEAD

      - name: Build helper and AccessKit fixture
        shell: pwsh
        run: |
          dotnet --list-runtimes
          $registered = @(Get-AppxPackage -Name 'Microsoft.WindowsAppRuntime*')
          Write-Host "Registered Windows App Runtime packages: $($registered.Count)"
          $registered | Select-Object Name, Version | Format-Table
          $bundle = '${{ matrix.publishMode }}' -eq 'bundled-windows-app-sdk'
          dotnet publish recording/native/windows/SpectreWindowCapture.csproj -c Release -r win-x64 --self-contained false -p:WindowsAppSDKSelfContained=$bundle -o "$env:RUNNER_TEMP\spectre-helper"
          cargo build --locked --release --manifest-path "$env:RUNNER_TEMP\accesskit-fixture\fixtures\accesskit\Cargo.toml"

      - name: Probe managed startup before a UIA call
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP\spectre-helper\SpectreWindowCapture.runtimeconfig.json"
          $start = [Diagnostics.ProcessStartInfo]::new("$env:RUNNER_TEMP\spectre-helper\SpectreWindowCapture.exe", 'accessibility-snapshot')
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.Environment['COREHOST_TRACE'] = '1'
          $trace = "$env:RUNNER_TEMP\uia-host-startup.log"
          $start.Environment['COREHOST_TRACEFILE'] = $trace
          $start.Environment['DOTNET_DISABLE_GUI_ERRORS'] = '1'
          $proc = [Diagnostics.Process]::Start($start)
          $stdout = $proc.StandardOutput.ReadToEndAsync()
          $stderr = $proc.StandardError.ReadToEndAsync()
          $proc.StandardInput.Write('{}')
          $proc.StandardInput.Close()
          if (-not $proc.WaitForExit(10000)) {
            $proc.Refresh()
            Write-Host "Startup stalled: hwnd=$($proc.MainWindowHandle) title=$($proc.MainWindowTitle)"
            $proc.Kill($true)
            $proc.WaitForExit()
          }
          Write-Host "Invalid-request probe exited $($proc.ExitCode)"
          Write-Host $stdout.GetAwaiter().GetResult()
          Write-Host $stderr.GetAwaiter().GetResult()
          if (Test-Path $trace) { Get-Content $trace -Tail 6 | ForEach-Object { $_.Substring(0,[Math]::Min(350,$_.Length)) } }
      - name: Read the live AccessKit fixture through UI Automation
        shell: pwsh
        run: |
          recording/native/windows/test-accesskit-fixture.ps1 `
            -Helper "$env:RUNNER_TEMP\spectre-helper\SpectreWindowCapture.exe" `
            -Fixture "$env:RUNNER_TEMP\accesskit-fixture\fixtures\accesskit\target\release\spectre-accesskit-fixture.exe" `
            -Golden "$env:RUNNER_TEMP\accesskit-fixture\fixtures\accesskit\golden\windows.json"
