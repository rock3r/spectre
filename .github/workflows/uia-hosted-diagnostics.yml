name: Windows release diagnostics
on:
  push:
    branches: [release-0.10/uia-hosted-smoke]
permissions:
  contents: read
jobs:
  gradle-overlap:
    name: Hosted Gradle marker ownership with diagnostics
    runs-on: windows-latest
    timeout-minutes: 48
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v6
        with:
          path: diagnostics
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: candidate
          ref: d859918ac7ba39e74d18b9db0749f4f19cd9f461
          persist-credentials: false
      - name: Verify and apply the cloud candidate
        shell: bash
        run: |
          git -C ../diagnostics show HEAD:marker-verification.patch > ../marker-exact.diff
          echo 'd879ecf7525c170ff05aa877d290d073789dba40c1781e1b3f3bc37c55c1f861  ../marker-exact.diff' | sha256sum --check
          git apply --cached ../marker-exact.diff
          test "$(git write-tree)" = e76928ffb22c7a14da53728e61ae4787ecb52133
          git checkout-index --force --all
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: gradle/actions/setup-gradle@v5
      - name: Exercise the marker test in the normal full check
        run: ./gradlew check
        shell: bash
        timeout-minutes: 40
      - name: Read the owned Gradle marker fixture report
        if: always()
        shell: pwsh
        run: |
          $p = Get-ChildItem 'agent/build/test-results/test' -Filter '*GradleLaunchMarkerIntegrationTest.xml' | Select-Object -First 1
          if (-not $p) { throw 'Missing marker fixture test XML' }
          [xml]$xml = Get-Content -LiteralPath $p.FullName -Raw
          foreach ($test in $xml.testsuite.testcase) {
            Write-Host "$($test.name): $($test.time) s"
            if ($test.failure) { Write-Host $test.failure.message }
          }
