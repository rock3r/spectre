name: Scratch native AT-SPI optional fields

on:
  workflow_dispatch:
    inputs:
      early_typed_timeout:
        description: Require final candidate typed early-timeout behavior
        type: boolean
        default: false
  push:
    branches: [release-0.10/gnome-hosted-smoke]
    paths:
      - .github/workflows/qa-atspi-optional-fields.yml
      - .github/qa-atspi-multi-window-contract/optional-fields-*

permissions:
  contents: read

jobs:
  cacheless-optional-fields:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASELINE_SHA: 3e831adde0ff84b535ec997446a347be90431304
      QA_EARLY_TYPED_TIMEOUT: ${{ inputs.early_typed_timeout && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: qa
          persist-credentials: false
      - name: Materialize exact baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          source qa/.github/qa-atspi-multi-window-contract/candidate.env
          git clone --filter=blob:none --no-checkout https://github.com/rock3r/spectre.git product
          git -C product checkout --detach "$BASELINE_SHA"
          test "$(git -C product rev-parse HEAD^{tree})" = 94c8531cbc03b17da73e7d1d4b82c3fcb189c4b2
          git -C product worktree add --detach "$GITHUB_WORKSPACE/candidate" "$BASELINE_SHA"
          if [[ -n "$CANDIDATE_SHA" ]]; then
            git -C candidate fetch origin "$CANDIDATE_SHA" --no-tags
            git -C candidate checkout --detach "$CANDIDATE_SHA"
          else
            test -n "$CANDIDATE_PATCH"
            git -C candidate apply --index "$GITHUB_WORKSPACE/qa/.github/qa-atspi-multi-window-contract/$CANDIDATE_PATCH"
          fi
          actual_tree=$(git -C candidate write-tree)
          test "$actual_tree" = "$CANDIDATE_FULL_TREE"
          printf '%s\n' "$BASELINE_SHA" >"$RUNNER_TEMP/baseline-commit.txt"
          printf '%s\n' "$actual_tree" >"$RUNNER_TEMP/candidate-tree.txt"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install real desktop and AT-SPI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox dbus-x11 at-spi2-core python3-dbus python3-gi gir1.2-gtk-3.0 libgtk-3-0t64 libatspi2.0-dev libdbus-1-dev pkg-config
      - name: Compile both native Linux sources
        run: |
          cargo build --release --locked --manifest-path product/recording/native/linux/Cargo.toml
          cargo build --release --locked --manifest-path candidate/recording/native/linux/Cargo.toml
      - name: Probe cacheless registered two-window adapter
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/qa-atspi-optional-fields"; mkdir -p "$artifacts"
          sha256sum product/recording/native/linux/target/release/spectre-wayland-helper candidate/recording/native/linux/target/release/spectre-wayland-helper >"$artifacts/helpers.sha256"
          dbus-run-session -- xvfb-run -a sh -c 'openbox >/tmp/openbox.log 2>&1 & exec env "$@"' sh \
            NO_AT_BRIDGE=0 GTK_MODULES=gail:atk-bridge \
            QA_ROOT="$GITHUB_WORKSPACE/qa/.github/qa-atspi-multi-window-contract" \
            ARTIFACTS="$artifacts" \
            BASELINE_HELPER="$GITHUB_WORKSPACE/product/recording/native/linux/target/release/spectre-wayland-helper" \
            CANDIDATE_HELPER="$GITHUB_WORKSPACE/candidate/recording/native/linux/target/release/spectre-wayland-helper" \
            QA_EARLY_TYPED_TIMEOUT="$QA_EARLY_TYPED_TIMEOUT" \
            "$GITHUB_WORKSPACE/qa/.github/qa-atspi-multi-window-contract/optional-fields-run-session.sh"
      - name: Preserve raw and typed actual results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-atspi-optional-fields-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qa-atspi-optional-fields
            ${{ runner.temp }}/baseline-commit.txt
            ${{ runner.temp }}/candidate-tree.txt
          if-no-files-found: error
          retention-days: 14
