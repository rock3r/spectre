name: QA helper timeout diagnostics

# Disposable QA workflow. It deliberately runs only on the named ephemeral branch and must
# never be merged to main. Product code/tests are checked out from the immutable public parent;
# the diagnostic script is copied aside first, so this workflow cannot alter what is tested.
on:
  push:
    branches:
      - release-0.10/verify-helper-windows

permissions:
  contents: read

jobs:
  helper-timeout-diagnostics:
    name: Windows loaded lane ${{ matrix.lane }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [1, 2]

    steps:
      - name: Check out QA harness only
        uses: actions/checkout@v6

      - name: Preserve standalone harness outside checkout
        shell: pwsh
        run: |
          Copy-Item .github/scripts/helper-timeout-diagnostics.ps1 `
            "$env:RUNNER_TEMP/helper-timeout-diagnostics.ps1"

      - name: Check out unmodified public parent
        uses: actions/checkout@v6
        with:
          ref: 6ba287814779aaaecd3501edc288bba7f3e31b1f
          clean: true

      - name: Prove pinned clean product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6ba287814779aaaecd3501edc288bba7f3e31b1f"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Capture source and JVM identity
        shell: pwsh
        run: |
          $evidence = "${{ runner.temp }}/evidence-lane-${{ matrix.lane }}"
          New-Item -ItemType Directory -Force $evidence | Out-Null
          git show HEAD:cli/src/test/kotlin/dev/sebastiano/spectre/cli/daemon/AccessibilityHelperClientTest.kt |
            Set-Content "$evidence/AccessibilityHelperClientTest.kt"
          java -version 2>&1 | Tee-Object "$evidence/java-version.txt"
          ./gradlew.bat -version | Tee-Object "$evidence/gradle-version.txt"
          ./gradlew.bat -q javaToolchains | Tee-Object "$evidence/java-toolchains.txt"

      - name: Run comparable loaded full check
        id: full_check
        continue-on-error: true
        shell: pwsh
        run: ./gradlew.bat check --no-daemon --max-workers=4 --stacktrace

      - name: Repeat fresh real-process helper test
        id: repeated_test
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/helper-timeout-diagnostics.ps1" `
            -Iterations 16 `
            -OutputDirectory "${{ runner.temp }}/evidence-lane-${{ matrix.lane }}/repetitions"

      - name: Prove diagnostics did not modify product source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6ba287814779aaaecd3501edc288bba7f3e31b1f"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload exact diagnostics and JUnit XML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: helper-timeout-diagnostics-lane-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/evidence-lane-${{ matrix.lane }}/
            **/build/test-results/**/*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Preserve failures after artifact upload
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.full_check.outcome }}" -ne "success") {
            throw "Pinned full Gradle check failed; see uploaded XML and logs"
          }
          if ("${{ steps.repeated_test.outcome }}" -ne "success") {
            throw "One or more fresh AccessibilityHelperClientTest runs failed; see diagnostics"
          }
