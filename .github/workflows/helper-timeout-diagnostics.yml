name: QA Gradle launch marker diagnostics

# Disposable hosted-Windows QA carrier. Never merge this workflow to a product branch.
on:
  push:
    branches:
      - release-0.10/verify-helper-windows

permissions:
  contents: read

env:
  PRODUCT_SHA: fd462c8dd790471a7da58865761ae540af66b3ac

jobs:
  full-check:
    name: Unfiltered Windows check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out QA carrier
        uses: actions/checkout@v6
      - name: Preserve harness outside checkout
        shell: pwsh
        run: Copy-Item .github/scripts/helper-timeout-diagnostics.ps1 "$env:RUNNER_TEMP/diagnostics.ps1"
      - name: Check out pinned unmodified product
        uses: actions/checkout@v6
        with:
          ref: fd462c8dd790471a7da58865761ae540af66b3ac
          clean: true
      - name: Prove pinned clean product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Run ordinary unfiltered check with read-only observer
        id: diagnostic
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/diagnostics.ps1" -Mode FullCheck `
            -OutputDirectory "$env:RUNNER_TEMP/launch-marker-full" -CommandTimeoutSeconds 2100
      - name: Prove source remains pinned and clean
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Upload bounded full-check receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-launch-marker-full-check
          path: ${{ runner.temp }}/launch-marker-full/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve diagnostic result after upload
        if: always()
        shell: pwsh
        run: if ("${{ steps.diagnostic.outcome }}" -ne "success") { throw "Full check failed or target XML was absent; inspect receipts" }

  repeated-class:
    name: Three complete launch-marker class runs
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out QA carrier
        uses: actions/checkout@v6
      - name: Preserve harness outside checkout
        shell: pwsh
        run: Copy-Item .github/scripts/helper-timeout-diagnostics.ps1 "$env:RUNNER_TEMP/diagnostics.ps1"
      - name: Check out pinned unmodified product
        uses: actions/checkout@v6
        with:
          ref: fd462c8dd790471a7da58865761ae540af66b3ac
          clean: true
      - name: Prove pinned clean product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Run three complete class repetitions
        id: diagnostic
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/diagnostics.ps1" -Mode RepeatClass -Iterations 3 `
            -OutputDirectory "$env:RUNNER_TEMP/launch-marker-repeated" -CommandTimeoutSeconds 600
      - name: Prove source remains pinned and clean
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Upload bounded repetition receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-launch-marker-three-runs
          path: ${{ runner.temp }}/launch-marker-repeated/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve diagnostic result after upload
        if: always()
        shell: pwsh
        run: if ("${{ steps.diagnostic.outcome }}" -ne "success") { throw "A class run failed or target XML was absent; inspect receipts" }
