name: Temporary hosted Linux release smoke

on:
  workflow_dispatch:
  push:
    branches: [release-0.10/gnome-hosted-smoke]
    paths:
      - .github/release-smoke-hosted.env
      - .github/workflows/release-smoke-hosted.yml
      - .github/scripts/verify-atspi-depth-prefix.py

# Verification only: do not grant publication, branch-update, or credential scopes.
permissions:
  contents: read

jobs:
  release-smoke-xvfb:
    if: github.ref == 'refs/heads/release-0.10/gnome-hosted-smoke' && !startsWith(github.event.head_commit.message, 'Diagnose Windows') && !startsWith(github.event.head_commit.message, 'Benchmark AT-SPI') && !startsWith(github.event.head_commit.message, 'Verify AT-SPI')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ startsWith(github.event.head_commit.message, 'Preserve Openbox') && fromJSON('["openbox"]') || fromJSON('["stock", "openbox"]') }}
    # The committed harness owns an unmodified 7,200-second execution budget. Leave
    # enough time around it for a clean checkout, tool installation, and report upload.
    timeout-minutes: 150

    steps:
      - name: Check out temporary orchestration
        uses: actions/checkout@v6
        with:
          path: orchestration
          persist-credentials: false

      - name: Read and validate pinned candidate
        id: control
        working-directory: orchestration
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-smoke-hosted.env
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" == "0.10.0" ]]
          [[ "$PHASE" == "REHEARSAL" || "$PHASE" == "CANDIDATE" ]]
          printf 'candidate_sha=%s\nrelease_version=%s\nphase=%s\n' \
            "$CANDIDATE_SHA" "$RELEASE_VERSION" "$PHASE" >> "$GITHUB_OUTPUT"

      - name: Check out the exact candidate with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.control.outputs.candidate_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          clean: true

      - name: Verify exact clean candidate and record rehearsal identity
        working-directory: candidate
        env:
          EXPECTED_SHA: ${{ steps.control.outputs.candidate_sha }}
          PHASE: ${{ steps.control.outputs.phase }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/release-smoke-identity"
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/release-smoke-identity/exact-sha.txt"
          printf '%s\n' "$PHASE" > "$RUNNER_TEMP/release-smoke-identity/phase.txt"

      - name: Verify the cloud-authored rehearsal overlay and clean test tree
        if: steps.control.outputs.phase == 'REHEARSAL' && steps.control.outputs.candidate_sha == '7d1c27a716a95d502d6e90daf684514bc82623dc'
        working-directory: candidate
        shell: bash
        run: |
          set -eu
          source "$GITHUB_WORKSPACE/orchestration/.github/release-smoke-hosted.env"
          printf '%s' "$AWT_FIXTURE_PATCH_GZIP_BASE64" | base64 -d | gzip -dc > "$RUNNER_TEMP/awt-test-fixture.patch"
          git apply --index "$RUNNER_TEMP/awt-test-fixture.patch"
          git diff --cached --check
          test "$(git write-tree)" = 78eda88b105f515a3b2d29c03097216bc99e90e0
          GIT_AUTHOR_DATE=2026-11-26T00:00:00Z GIT_COMMITTER_DATE=2026-11-26T00:00:00Z git -c user.name=Verification -c user.email=verification@localhost commit -m "Rehearse the scoped native desktop service and mapped recording fixtures"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$CANDIDATE_SHA" > "$RUNNER_TEMP/release-smoke-identity/original-sha.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/release-smoke-identity/exact-sha.txt"
          git write-tree > "$RUNNER_TEMP/release-smoke-identity/exact-tree.txt"

      - name: Set up JDK 21 toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up default JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle without cache writes
        uses: gradle/actions/setup-gradle@v5
        with:
          build-root-directory: candidate
          cache-read-only: true

      - name: Install Xorg, recording, and Linux native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            xvfb xauth x11-utils xdotool ffmpeg libxkbcommon-x11-0 python3-pyatspi \
            libdbus-1-dev pkg-config dbus-x11 dbus-user-session openbox at-spi2-core \
            libatk-wrapper-java libatk-wrapper-java-jni libatspi2.0-dev libxcursor1 \
            libxrandr2 libxinerama1 libxi6 libxtst6 libgl1-mesa-dri libgtk-3-0t64 \
            libpipewire-0.3-dev libspa-0.2-dev gstreamer1.0-libav \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly
          command -v Xvfb
          command -v xauth
          command -v ffmpeg
          for element in ximagesrc x264enc h264parse mp4mux pngenc; do
            gst-inspect-1.0 "$element" > "$RUNNER_TEMP/release-smoke-identity/gstreamer-$element.txt"
          done
          dpkg -L libatk-wrapper-java libatk-wrapper-java-jni > "$RUNNER_TEMP/release-smoke-identity/java-atk-packages.txt"
          # The harness requests "xvfb-run -a" for each independent headed cell.
          # Start its window manager and accessibility bus inside each new display.
          mkdir -p "$RUNNER_TEMP/x11-session-tools"
          cat > "$RUNNER_TEMP/x11-session-tools/xvfb-run" <<'LAUNCHER'
          #!/usr/bin/env bash
          set -eu
          if [[ ${1-} != -a ]]; then exec /usr/bin/xvfb-run "$@"; fi
          shift
          if [[ -n ${DBUS_SESSION_BUS_ADDRESS:-} ]]; then
            # The packaged fixture and its CLI must share the release harness's own bus.
            exec /usr/bin/xvfb-run -a x11-smoke-session "$@"
          fi
          exec /usr/bin/xvfb-run -a dbus-run-session -- x11-smoke-session "$@"
          LAUNCHER
          cat > "$RUNNER_TEMP/x11-session-tools/x11-smoke-session" <<'SESSION'
          #!/usr/bin/env bash
          set -eu
          openbox >"$RUNNER_TEMP/release-smoke-identity/openbox-${DISPLAY#:}-$BASHPID.log" 2>&1 &
          wm_pid=$!
          trap 'kill "$wm_pid" 2>/dev/null || true' EXIT
          for _ in {1..100}; do
            if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q 'window id'; then break; fi
            sleep 0.05
          done
          xprop -root _NET_SUPPORTING_WM_CHECK | grep 'window id' >/dev/null
          gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.a11y.Bus.GetAddress >/dev/null
          if [[ " $* " == *" check "* ]]; then
            (
              while :; do
                printf 'sample %s DISPLAY=%s\n' "$(date -u +%FT%T.%3NZ)" "$DISPLAY"
                focus=$(xdotool getwindowfocus 2>/dev/null || true)
                printf 'focus xid=%s\n' "$focus"
                xdotool getmouselocation 2>/dev/null || true
                while read -r xid; do
                  details=$(xprop -id "$xid" _NET_WM_PID WM_NAME 2>/dev/null | tr '\n' ' ')
                  pid=$(xdotool getwindowpid "$xid" 2>/dev/null || true)
                  if [[ "$pid" =~ ^[0-9]+$ ]]; then
                    printf 'xid=%s %s ppid=%s cwd=%s ' "$xid" "$details" "$(ps -o ppid= -p "$pid")" "$(readlink "/proc/$pid/cwd")"
                    xdotool getwindowgeometry "$xid" 2>/dev/null | tr '\n' ' ' || true
                    echo
                  fi
                done < <(xdotool search --onlyvisible --name '.' 2>/dev/null || true)
                sleep 0.3
              done
            ) > "$RUNNER_TEMP/release-smoke-identity/x11-window-owners.txt" 2>&1 &
            observer=$!
            trap 'kill "$observer" "$wm_pid" 2>/dev/null || true' EXIT
          fi
          "$@"
          SESSION
          chmod +x "$RUNNER_TEMP/x11-session-tools/"*
          # Record an independent ready Openbox/D-Bus control, then give the release
          # script the distribution's unchanged xvfb-run, its documented X11 default.
          PATH="$RUNNER_TEMP/x11-session-tools:$PATH" xvfb-run -a bash -c '
            xprop -root _NET_SUPPORTING_WM_CHECK
            xdpyinfo | grep dimensions
            gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.a11y.Bus.GetAddress
          ' > "$RUNNER_TEMP/release-smoke-identity/openbox-control.txt"
          if [[ "${{ matrix.mode }}" == openbox ]]; then
            echo "$RUNNER_TEMP/x11-session-tools" >> "$GITHUB_PATH"
          fi
          printf '%s\n' "${{ matrix.mode }}" > "$RUNNER_TEMP/release-smoke-identity/harness-display-control.txt"

      - name: Set up stable Rust for the Linux native helper
        uses: dtolnay/rust-toolchain@stable

      - name: Run the complete committed release smoke under forced Xvfb
        working-directory: candidate
        shell: bash
        run: |
          set -eu
          python3 -u - <<'PYTHON' &
          import hashlib
          import os
          from pathlib import Path
          import time
          import xml.etree.ElementTree as ET
          evidence = Path(os.environ["RUNNER_TEMP"]) / "release-smoke-identity/failed-tests"
          evidence.mkdir(exist_ok=True)
          seen = set()
          while True:
              for module in ("agent", "cli", "core", "recording"):
                  for xml in Path(module, "build/test-results").glob("*/TEST-*.xml"):
                      try:
                          st = xml.stat()
                          identity = (xml, st.st_mtime_ns, st.st_size)
                          if identity in seen:
                              continue
                          data = xml.read_bytes()
                          suite = ET.fromstring(data)
                          if int(suite.get("failures", 0)) or int(suite.get("errors", 0)):
                              path = evidence / (module + "-" + hashlib.sha256(data).hexdigest()[:12] + "-" + xml.name)
                              path.write_bytes(data)
                          seen.add(identity)
                      except (OSError, ET.ParseError):
                          pass
              time.sleep(2)
          PYTHON
          xml_sampler=$!
          python3 scripts/release-smoke.py --version 0.10.0 --display-mode xvfb &
          smoke_pid=$!
          (
            for delay in 300 240 240 240 100; do
              sleep "$delay"
              kill -0 "$smoke_pid" 2>/dev/null || break
              stamp=$(date -u +%H%M%S)
              evidence="$RUNNER_TEMP/release-smoke-identity"
              jcmd -l | grep -E 'GradleWorkerMain|GradleDaemon' > "$evidence/java-test-processes-$stamp.txt" || true
              while read -r child_pid command; do
                case "$command" in
                  *GradleWorkerMain*|*GradleDaemon*)
                    timeout 20s jcmd "$child_pid" Thread.print -l > "$evidence/java-threads-$stamp-$child_pid.txt" 2>&1 &
                    ;;
                esac
              done < "$evidence/java-test-processes-$stamp.txt"
              wait || true
            done
          ) &
          sampler_pid=$!
          trap 'kill "$sampler_pid" "$xml_sampler" 2>/dev/null || true' EXIT
          wait "$smoke_pid"

      - name: Upload release-smoke reports and original per-step logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-linux-xvfb-${{ steps.control.outputs.phase }}-${{ matrix.mode }}-${{ github.run_attempt }}
          path: |
            candidate/build/smoke/release-smoke.json
            candidate/build/smoke/release-smoke.md
            candidate/build/smoke/**/*.log
            candidate/**/build/test-results/**/*.xml
            ${{ runner.temp }}/release-smoke-identity/*.txt
            ${{ runner.temp }}/release-smoke-identity/openbox-*.log
            ${{ runner.temp }}/release-smoke-identity/failed-tests/*.xml
            ${{ runner.temp }}/release-smoke-identity/exact-sha.txt
            ${{ runner.temp }}/release-smoke-identity/phase.txt
          if-no-files-found: error
          retention-days: 14


  short-java-exit:
    if: github.ref == 'refs/heads/release-0.10/gnome-hosted-smoke' && startsWith(github.event.head_commit.message, 'Diagnose Windows')
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        replica: ${{ startsWith(github.event.head_commit.message, 'Diagnose Windows isolated') && fromJSON('[1]') || fromJSON('[1,2]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bd60a28580dd77a76cd334677f122f628a9d6dc7
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Install .NET 8 for the original Windows full gate
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Apply the cloud Windows launch deadline fix to exact main
        shell: bash
        env:
          WINDOWS_PATCH: 
        run: |
          set -euo pipefail
          printf '%s' "$WINDOWS_PATCH" | base64 -d | gzip -dc > "$RUNNER_TEMP/windows-launch.diff"
          git apply --index "$RUNNER_TEMP/windows-launch.diff"
          test "$(git write-tree)" = 5430a3b57f750ba8c700a0ec83b5ed13915d6842
      - name: Verify healthy launches and process boundaries
        if: matrix.replica == 1 && !startsWith(github.event.head_commit.message, 'Diagnose Windows isolated')
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :agent:test --tests '*LaunchAndAttachIntegrationTest' --tests '*BoundedAttachOperationTest' --rerun --console=plain
          mkdir -p "$RUNNER_TEMP/healthy-launch-results"
          cp agent/build/test-results/test/TEST-*{LaunchAndAttachIntegrationTest,BoundedAttachOperationTest}.xml "$RUNNER_TEMP/healthy-launch-results/"
      - name: Run the official full gate with its normal parallel workload
        if: matrix.replica == 2
        timeout-minutes: 40
        run: ./gradlew check
      - name: Repeated native Windows short-launch classification
        if: always() && matrix.replica == 1
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = bd60a28580dd77a76cd334677f122f628a9d6dc7
          cat > "$RUNNER_TEMP/replay-short-launch.py" <<'PYTHON'
          import os
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile
          from xml.etree import ElementTree as ET

          checkout = Path.cwd()
          out = Path(sys.argv[1]).absolute()
          out.mkdir(parents=True, exist_ok=True)
          reps = int(sys.argv[2])
          wrapper = checkout / "gradlew.bat"
          output = checkout / "agent/build/test-results/test"
          matcher = "*LaunchAndAttachIntegrationTest.java -version exits as stage PROCESS_ALIVE with stderr capture files*"
          for index in range(1, reps + 1):
              name = f"repetition-{index:02}"
              command = [str(wrapper), ":agent:test", "--tests", matcher, "--rerun", "--console=plain"]
              runner = Path.home()/".codex/skills/gradle-run/scripts/gradle_run.py"
              if runner.is_file() and "GITHUB_ACTIONS" not in os.environ:
                  managed = [sys.executable, str(runner), "--root", str(out/"gradle-run")]
                  workflow = json.loads(subprocess.check_output(managed+["create"], text=True))["workflow"]
                  command = managed+["run","--workflow",workflow,"--scope","targeted","--question","Does the short java version child retain PROCESS_ALIVE classification under Windows?","--"]+command
              with (out/(name+".log")).open("w",encoding="utf-8") as log:
                  proc = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
              if runner.is_file() and "GITHUB_ACTIONS" not in os.environ:
                  subprocess.run(managed+["finish","--workflow",workflow],check=True)
              matches = list(output.glob("TEST-*LaunchAndAttachIntegrationTest.xml"))
              if len(matches) != 1:
                  raise Exception(f"{name}: expected one report, got {matches} (Gradle {proc.returncode})")
              report = ET.parse(matches[0]).getroot()
              cases = [t for t in report.findall("testcase") if "java -version exits" in t.attrib.get("name","")]
              if len(cases) != 1:
                  raise Exception(f"{name}: expected the single short-exit test, got {len(cases)}")
              case = cases[0]
              if case.find("skipped") is not None:
                  raise Exception(f"{name}: unexpectedly skipped")
              shutil.copy2(matches[0],out/(name+".xml"))
              fail = case.find("failure")
              status = "pass" if proc.returncode == 0 and fail is None else "fail"
              print(name,status,case.get("time"),flush=True)
              with (out/"receipts.jsonl").open("a",encoding="utf-8") as receipt:
                  receipt.write(json.dumps({"repetition":index,"status":status,"seconds":case.get("time"),"returncode":proc.returncode,"failure":None if fail is None else fail.text})+"\n")
          if any(json.loads(line)["status"] != "pass" for line in (out/"receipts.jsonl").read_text().splitlines()):
              raise SystemExit(1)
          PYTHON
          python "$RUNNER_TEMP/replay-short-launch.py" "$RUNNER_TEMP/short-launch-receipts" 24
      - name: Upload per-process assertions and full cause XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-java-exit-windows-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/short-launch-receipts
            ${{ runner.temp }}/healthy-launch-results
            agent/build/test-results/test/TEST-*LaunchAndAttachIntegrationTest.xml
            **/build/test-results/**/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

  reader-throughput:
    if: github.ref == 'refs/heads/release-0.10/gnome-hosted-smoke' && (startsWith(github.event.head_commit.message, 'Benchmark AT-SPI') || startsWith(github.event.head_commit.message, 'Diagnose Windows pipe') || startsWith(github.event.head_commit.message, 'Diagnose Windows isolated') || startsWith(github.event.head_commit.message, 'Verify AT-SPI'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: b1c85111241558431a7ccd939b98dfbda08473c7
          path: product
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: e3368c3c2476f9b955290cfdcb05722908f1f4a5
          path: fixture
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 07507bc9175b6391d6594ff175dff233e34a0675
          path: baseline-control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 5f96c5779da47d093c1e31497ecd8e1e785726ea
          path: pre-cutoff
          persist-credentials: false
      - name: Verify exact product tree and stage the existing cloud benchmark
        env:
          LARGE_FIXTURE: 
          LARGE_HARNESS: 
        run: |
          set -euo pipefail
          git -C product worktree add --detach ../baseline HEAD
          git -C baseline apply --index "$GITHUB_WORKSPACE/baseline-control/.github/reader-overlays/716-b1-cached-owner.patch"
          test "$(git -C baseline write-tree)" = 93dcbb2ae2302e04ca0a3f316b1a90b669cef7fe
          git -C product apply --index "$GITHUB_WORKSPACE/control/.github/reader-overlays/716-b1-cached-owner.patch"
          test "$(git -C product write-tree)" = 94c8531cbc03b17da73e7d1d4b82c3fcb189c4b2
          test "$(git -C product hash-object recording/native/linux/src/accessibility.rs)" = 9a8ecd3bdfbccbca394d818011515a23563ad744
          test "$(git -C pre-cutoff rev-parse HEAD)" = 5f96c5779da47d093c1e31497ecd8e1e785726ea
          test "$(git -C pre-cutoff rev-parse HEAD^{tree})" = 97b3c15a0c0d15b8d964c10c6f60c58d0d53b8cb
          test "$(git -C pre-cutoff hash-object recording/native/linux/src/accessibility.rs)" = 333266f35e03084ac892d0281b1861724ce6a48c
          mkdir -p "$RUNNER_TEMP/atspi-results"
          git -C product write-tree > "$RUNNER_TEMP/atspi-results/product-tree.txt"
          printf '%s' "$LARGE_FIXTURE" | base64 -d | gzip -dc > "$RUNNER_TEMP/benchmark-fixture.diff"
          git -C fixture apply --index "$RUNNER_TEMP/benchmark-fixture.diff"
          printf '%s' "$LARGE_HARNESS" | base64 -d | gzip -dc > "$RUNNER_TEMP/benchmark.py"
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and test native binaries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y at-spi2-core xvfb xauth dbus-x11 python3-dbus pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libxcursor1 libxi6 libxrandr2 libxinerama1 libxkbcommon-x11-0
          cargo build --release --locked --manifest-path baseline/recording/native/linux/Cargo.toml
          cargo build --release --locked --manifest-path pre-cutoff/recording/native/linux/Cargo.toml
          cargo test --release --locked --manifest-path product/recording/native/linux/Cargo.toml | tee "$RUNNER_TEMP/atspi-results/native-tests.txt"
          cargo build --release --locked --manifest-path product/recording/native/linux/Cargo.toml
          cargo build --release --locked --manifest-path fixture/fixtures/accesskit/Cargo.toml
      - name: Time ten independent process reads on a private real AT-SPI session
        run: |
          set -euo pipefail
          lscpu > "$RUNNER_TEMP/atspi-results/cpu.txt"
          python3 - <<'PYTHON'
          from pathlib import Path
          import os
          p = Path(os.environ["RUNNER_TEMP"]) / "benchmark.py"
          s = p.read_text()
          first = 'if candidate and (candidate.get("ok") or "register with AT-SPI" not in message):'
          assert first in s
          s = s.replace(first, 'if candidate and candidate.get("ok") and len(candidate["snapshot"]["nodes"]) == 1544:')
          hook = 'def percentile95(values):'
          auditor = """original_request = request
          capture_dir = Path(os.environ['RUNNER_TEMP']) / 'atspi-results'
          from runpy import run_path
          initial_pid = None
          def request(*args, **kwargs):
              global initial_pid
              pid = args[1]
              if initial_pid is None:
                  initial_pid = pid
                  os.environ.update(SMOKE_ARTIFACTS=str(capture_dir), ATSPI_REPO=os.environ['GITHUB_WORKSPACE']+'/product')
                  original_argv = sys.argv
                  try:
                      sys.argv = ['provider-diagnostic']
                      api = run_path(os.environ['GITHUB_WORKSPACE'] + '/control/.github/scripts/gnome-observe-roles.py')
                  finally:
                      sys.argv = original_argv
                  service, path = api['application_root'](pid)
                  iface = api['accessible']
                  connection = api['bus']
                  windows = []
                  for name, child in api['dbus'].Interface(connection.get_object(service, path), iface).GetChildren():
                      props = api['dbus'].Interface(connection.get_object(name, child), 'org.freedesktop.DBus.Properties')
                      windows.append({'path': str(child), 'name':str(props.Get(iface, 'Name')), 'service':str(name)})
                  raw = {'pid':int(api['bus_admin'].GetConnectionUnixProcessID(service)), 'service':str(service),'path':str(path),'windows':windows}
                  (capture_dir/'provider-owner.json').write_text(json.dumps(raw))
                  assert raw['pid'] == pid and any('AccessKit' in item['name'] for item in windows), raw
                  control = Path(os.environ['GITHUB_WORKSPACE']) / 'baseline/recording/native/linux/target/release/spectre-wayland-helper'
                  pre_cutoff = Path(os.environ['GITHUB_WORKSPACE']) / 'pre-cutoff/recording/native/linux/target/release/spectre-wayland-helper'
                  verifier = Path(os.environ['GITHUB_WORKSPACE']) / 'control/.github/scripts/verify-atspi-depth-prefix.py'
                  subprocess.run(['/usr/bin/python3', str(verifier), '--pid', str(pid), '--candidate', str(args[0]), '--pre-cutoff', str(pre_cutoff), '--artifacts', str(capture_dir)], check=True)
                  for iteration in range(6):
                      latency, baseline, err = original_request(control, pid, 5000, args[3])
                      receipt = {'iteration':iteration,'pid':pid,'elapsed':latency,'error':err,'replyError':(baseline or {}).get('error'),'nodes':len((baseline or {}).get('snapshot',{}).get('nodes',[]))}
                      with (capture_dir/'baseline.jsonl').open('a') as output:
                          output.write(json.dumps(receipt) + chr(10))
                      if baseline and baseline.get('ok'):
                          with (capture_dir/'baseline-fields.jsonl').open('a') as output:
                              output.write(json.dumps(baseline['snapshot']['nodes'],sort_keys=True) + chr(10))
                  with (capture_dir/'baseline.jsonl').open() as stream:
                      proven = [json.loads(line)['nodes'] for line in stream]
                  if proven != [1544] * 6:
                      raise AssertionError('Control did not establish the full provider tree: ' + str(proven))
                  import hashlib
                  for timeout in (750, 5000):
                      for iteration in range(6):
                          latency, candidate, err = original_request(args[0], pid, timeout, args[3])
                          snap = (candidate or {}).get('snapshot', {})
                          nodes = snap.get('nodes', [])
                          receipt = {'iteration':iteration, 'timeout':timeout, 'pid':pid, 'elapsed':latency, 'error':err, 'replyError':(candidate or {}).get('error'), 'nodes':len(nodes)}
                          if nodes:
                              validate(candidate)
                              receipt['sha256'] = hashlib.sha256(json.dumps(nodes, sort_keys=True).encode()).hexdigest()
                              receipt['edges'] = sum(n.get('parentKey') is not None for n in nodes)
                          with (capture_dir/'candidate-measurements.jsonl').open('a') as output:
                              output.write(json.dumps(receipt) + chr(10))
              assert initial_pid == pid
              elapsed, response, error = original_request(*args, **kwargs)
              if not response or not response.get('ok'):
                  with (capture_dir/'candidate-errors.jsonl').open('a') as output:
                      output.write(json.dumps({'pid':pid,'timeout':args[2],'elapsed':elapsed,'error':error,'reply':response}) + chr(10))
              if response and response.get('ok'):
                  nodes = response['snapshot']['nodes']
                  fields = ('key', 'parentKey', 'id', 'role', 'platformRole', 'name', 'value', 'states', 'actions', 'bounds')
                  raw = [{field: n.get(field) for field in fields} for n in nodes]
                  with (capture_dir / 'fields.jsonl').open('a') as output:
                      output.write(json.dumps(raw, sort_keys=True) + chr(10))
              return elapsed, response, error

          """
          assert hook in s
          p.write_text(s.replace(hook, auditor + hook))
          PYTHON
          dbus-run-session -- xvfb-run -a bash -c 'set -e; gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.freedesktop.DBus.Properties.Set org.a11y.Status IsEnabled "<true>"; exec "$@"' bash /usr/bin/python3 "$RUNNER_TEMP/benchmark.py" --fixture "$GITHUB_WORKSPACE/fixture/fixtures/accesskit/target/release/spectre-accesskit-fixture" --helper "$GITHUB_WORKSPACE/product/recording/native/linux/target/release/spectre-wayland-helper" --timeouts 750,5000 --calls 5 | tee "$RUNNER_TEMP/atspi-results/latencies.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atspi-pipeline-benchmark
