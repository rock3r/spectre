name: Temporary GNOME hosted smoke

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full SHA of the original release-candidate base checkout
        required: false
        default: 7ececf7a7ac361d87417bb07108cc475f7cf890e
  push:
    branches: [release-0.10/gnome-hosted-smoke]
    paths-ignore:
      - .github/release-smoke-hosted.env
      - .github/workflows/release-smoke-hosted.yml

# Verification only: this workflow cannot update the temporary branch, publish, or use secrets.
permissions:
  contents: read

jobs:
  gnome-mutter-window-identity:
    if: github.ref == 'refs/heads/release-0.10/gnome-hosted-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        mode: [portal, capture, accessibility, atspi-ownership, identity, mutter-control]

    steps:
      - name: Check out temporary workflow tooling
        uses: actions/checkout@v6
        with:
          path: smoke-tooling
          persist-credentials: false

      - name: Check out the release candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || '7ececf7a7ac361d87417bb07108cc475f7cf890e' }}
          persist-credentials: false
          path: candidate

      - name: Check out full AT-SPI reader candidate
        if: matrix.mode == 'accessibility' || matrix.mode == 'atspi-ownership'
        uses: actions/checkout@v6
        with:
          ref: ebda65d1c23604dbea9dccc987293259afe3c0ef
          persist-credentials: false
          path: atspi-reader

      - name: Apply and verify canonical reader candidate
        if: matrix.mode == 'accessibility' || matrix.mode == 'atspi-ownership'
        working-directory: atspi-reader
        run: |
          patch="$GITHUB_WORKSPACE/smoke-tooling/.github/reader-overlays/canonical-atspi.patch"
          printf '%s  %s\n' 63df1beae77c775c5862ddf44ac6f2b23f0e72c2697b15cecd49579c8bc89316 "$patch" | sha256sum -c -
          git apply --index "$patch"
          test "$(git write-tree)" = 4f8fbefa6e79a6cbfa86e38789f5f8bf7136e6c7

      - name: Check out native accessibility fixture
        if: matrix.mode == 'accessibility' || matrix.mode == 'atspi-ownership'
        uses: actions/checkout@v6
        with:
          ref: 96cd6cb20e44d5d26a4cfb93d8a3f8e1b6375aa8
          persist-credentials: false
          path: fixture

      - name: Apply pinned cloud candidate overlays
        if: matrix.mode == 'capture' || matrix.mode == 'identity'
        working-directory: smoke-tooling/.github/smoke-overlays
        run: |
          sha256sum -c SHA256SUMS
          while read -r digest overlay; do
            git -C "$GITHUB_WORKSPACE/candidate" apply --3way --index "$PWD/$overlay"
          done < SHA256SUMS
          git -C "$GITHUB_WORKSPACE/candidate" diff --cached --check
          git -C "$GITHUB_WORKSPACE/candidate" write-tree
          git -C "$GITHUB_WORKSPACE/candidate" diff --cached --stat

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-root-directory: candidate

      - name: Run GNOME, Mutter, AT-SPI, and window-identity smoke
        env:
          ATSPI_REPO: ${{ github.workspace }}/atspi-reader
          FIXTURE_CHECKOUT: ${{ github.workspace }}/fixture
          SMOKE_MODE: ${{ matrix.mode }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || '7ececf7a7ac361d87417bb07108cc475f7cf890e' }}
          SMOKE_ARTIFACTS: ${{ runner.temp }}/gnome-hosted-smoke
          SMOKE_REPO: ${{ github.workspace }}/candidate
          SMOKE_SESSION_SCRIPT: ${{ github.workspace }}/smoke-tooling/.github/scripts/gnome-hosted-smoke-session.sh
        run: |
          export SMOKE_USER="$(id -un)" RUST_BIN="$(dirname "$(command -v cargo)")"
          sudo --preserve-env=ATSPI_REPO,FIXTURE_CHECKOUT,SMOKE_MODE,SMOKE_USER,RUST_BIN,CANDIDATE_SHA,JAVA_HOME,SMOKE_ARTIFACTS,SMOKE_REPO,SMOKE_SESSION_SCRIPT .github/scripts/gnome-hosted-smoke.sh
        working-directory: smoke-tooling

      - name: Upload fail-closed GNOME diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-hosted-smoke-${{ matrix.mode }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gnome-hosted-smoke/
          if-no-files-found: error
          retention-days: 7
