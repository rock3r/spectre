name: Temporary GNOME hosted smoke

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full SHA of the original release-candidate base checkout
        required: false
        default: 51cf4ee24572c14fe48da0fb15be1b3d9aaea9b6
  push:
    branches: [release-0.10/gnome-hosted-smoke]
    paths-ignore:
      - .github/workflows/gnome-jammy-smoke.yml
      - .github/smoke-overlays/jammy-identity.patch
      - .github/reader-overlays/726-packaged-smoke.patch
      - .github/workflows/a11y-packaged-release-cell.yml
      - .github/release-smoke-hosted.env
      - .github/workflows/release-smoke-hosted.yml

# Verification only: this workflow cannot update the temporary branch, publish, or use secrets.
permissions:
  contents: read

jobs:
  public-wayland-cli-recording-live:
    if: github.ref == 'refs/heads/release-0.10/gnome-hosted-smoke' && !startsWith(github.event.head_commit.message, 'Verify Jammy') && !startsWith(github.event.head_commit.message, 'Verify AT-SPI') && !startsWith(github.event.head_commit.message, 'Calibrate') && !startsWith(github.event.head_commit.message, 'Capture original') && github.event.head_commit.message != 'Provision XRandR for live geometry calibration'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out temporary workflow tooling
        uses: actions/checkout@v6
        with:
          path: smoke-tooling
          persist-credentials: false

      - name: Check out the release candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || '51cf4ee24572c14fe48da0fb15be1b3d9aaea9b6' }}
          persist-credentials: false
          path: candidate

      - name: Verify the immutable public GNOME candidate
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = 51cf4ee24572c14fe48da0fb15be1b3d9aaea9b6
          test "$(git write-tree)" = d889d474eee688cbf3da4a141b3407777a313af8
          test -z "$(git status --porcelain)"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-root-directory: candidate

      - name: Run installed CLI and public recording API on the attended GNOME seat
        env:
          ATSPI_REPO: unused
          FIXTURE_CHECKOUT: unused
          SMOKE_MODE: cli-recording-live
          CANDIDATE_SHA: ${{ inputs.candidate_sha || '51cf4ee24572c14fe48da0fb15be1b3d9aaea9b6' }}
          SMOKE_ARTIFACTS: ${{ runner.temp }}/gnome-cli-recording-live
          SMOKE_REPO: ${{ github.workspace }}/candidate
          SMOKE_SESSION_SCRIPT: ${{ github.workspace }}/smoke-tooling/.github/scripts/gnome-hosted-smoke-session.sh
        run: |
          export SMOKE_USER="$(id -un)" RUST_BIN="$(dirname "$(command -v cargo)")"
          sudo --preserve-env=ATSPI_REPO,FIXTURE_CHECKOUT,SMOKE_MODE,SMOKE_USER,RUST_BIN,CANDIDATE_SHA,JAVA_HOME,SMOKE_ARTIFACTS,SMOKE_REPO,SMOKE_SESSION_SCRIPT .github/scripts/gnome-hosted-smoke.sh
        working-directory: smoke-tooling

      - name: Upload CLI and recording live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-cli-recording-live-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gnome-cli-recording-live/
          if-no-files-found: error
          retention-days: 7

  gnome-mutter-window-identity:
    if: github.ref == 'refs/heads/release-0.10/gnome-hosted-smoke' && !startsWith(github.event.head_commit.message, 'Verify Jammy') && !startsWith(github.event.head_commit.message, 'Verify packaged')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        mode: [accessibility]
        replica: [1]

    steps:
      - name: Check out temporary workflow tooling
        uses: actions/checkout@v6
        with:
          path: smoke-tooling
          persist-credentials: false

      - name: Check out the release candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || '51cf4ee24572c14fe48da0fb15be1b3d9aaea9b6' }}
          persist-credentials: false
          path: candidate

      - name: Check out full AT-SPI reader candidate
        if: matrix.mode == 'accessibility' || matrix.mode == 'atspi-ownership' || matrix.mode == 'atspi-distinct-content'
        uses: actions/checkout@v6
        with:
          ref: b1c85111241558431a7ccd939b98dfbda08473c7
          persist-credentials: false
          path: atspi-reader

      - name: Apply and verify canonical reader candidate
        if: matrix.mode == 'accessibility' || matrix.mode == 'atspi-ownership' || matrix.mode == 'atspi-distinct-content'
        working-directory: atspi-reader
        run: |
          patch="$GITHUB_WORKSPACE/smoke-tooling/.github/reader-overlays/716-b1-cached-owner.patch"
          printf '%s  %s\n' e0273b71701733bcb2126bec1c719a7f3173b5a16b47b9deedd97ff19bd903f4 "$patch" | sha256sum -c -
          git apply --index "$patch"
          test "$(git write-tree)" = 5fde5f45ce7bc4736fb7e3c146d6d40b00588007

      - name: Check out native accessibility fixture
        if: matrix.mode == 'accessibility' || matrix.mode == 'atspi-ownership' || matrix.mode == 'atspi-distinct-content'
        uses: actions/checkout@v6
        with:
          ref: e3368c3c2476f9b955290cfdcb05722908f1f4a5
          persist-credentials: false
          path: fixture

      - name: Verify the immutable public GNOME candidate
        if: matrix.mode == 'capture' || matrix.mode == 'public-window-crop'
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = 51cf4ee24572c14fe48da0fb15be1b3d9aaea9b6
          test "$(git write-tree)" = d889d474eee688cbf3da4a141b3407777a313af8
          test -z "$(git status --porcelain)"

      - name: Apply standalone caller-owned window identity candidate
        if: matrix.mode == 'identity'
        working-directory: candidate
        run: |
          patch="$GITHUB_WORKSPACE/smoke-tooling/.github/identity-overlays/gnome46-xid.patch"
          printf '%s  %s\n' 818970f0ecb4ce23c6d6d91aaeabd939641c03f57d3f21befd948a106fab907a "$patch" | sha256sum -c -
          git apply --index "$patch"
          git diff --cached --check
          git write-tree

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-root-directory: candidate

      - name: Run GNOME, Mutter, AT-SPI, and window-identity smoke
        env:
          ATSPI_REPO: ${{ github.workspace }}/atspi-reader
          FIXTURE_CHECKOUT: ${{ github.workspace }}/fixture
          SMOKE_MODE: ${{ matrix.mode }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || '51cf4ee24572c14fe48da0fb15be1b3d9aaea9b6' }}
          SMOKE_ARTIFACTS: ${{ runner.temp }}/gnome-hosted-smoke
          SMOKE_REPO: ${{ github.workspace }}/candidate
          SMOKE_SESSION_SCRIPT: ${{ github.workspace }}/smoke-tooling/.github/scripts/gnome-hosted-smoke-session.sh
        run: |
          export SMOKE_USER="$(id -un)" RUST_BIN="$(dirname "$(command -v cargo)")"
          sudo --preserve-env=ATSPI_REPO,FIXTURE_CHECKOUT,SMOKE_MODE,SMOKE_USER,RUST_BIN,CANDIDATE_SHA,JAVA_HOME,SMOKE_ARTIFACTS,SMOKE_REPO,SMOKE_SESSION_SCRIPT .github/scripts/gnome-hosted-smoke.sh
        working-directory: smoke-tooling

      - name: Upload fail-closed GNOME diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-hosted-smoke-${{ matrix.mode }}-replica-${{ matrix.replica }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gnome-hosted-smoke/
          if-no-files-found: error
          retention-days: 7
