name: Verify public disabled accessibility packaged surfaces

on:
  workflow_dispatch:
  push:
    branches: [release-0.10/gnome-hosted-smoke]
    paths:
      - .github/qa-public-disabled-atspi.env

permissions:
  contents: read
  actions: read

jobs:
  packaged-disabled-atspi:
    if: github.ref == 'refs/heads/release-0.10/gnome-hosted-smoke' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Verify public disabled accessibility'))
    runs-on: ubuntu-24.04
    env:
      COMPLETE_STOCK: ${{ endsWith(github.event.head_commit.message, 'full consent case') }}
      ATTACHED_CHECK: ${{ endsWith(github.event.head_commit.message, 'attached and standalone') }}
      REUSE_STOCK_ZIP: ${{ startsWith(github.event.head_commit.message, 'Verify public disabled accessibility stock replay') }}
    timeout-minutes: 60
    steps:
      - name: Check out scratch QA without credentials
        uses: actions/checkout@v6
        with:
          path: scratch
          persist-credentials: false
      - name: Authenticate exact public source input
        shell: bash
        run: |
          set -euo pipefail
          control=scratch/.github/qa-public-disabled-atspi.env
          test "$(grep -Evc '^(#.*|$|PUBLIC_SHA=(HOLD|[0-9a-f]{40})|VERSION_NAME=0\.10\.0)$' "$control")" -eq 0
          source "$control"
          [[ "$PUBLIC_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'PUBLIC_SHA remains HOLD; coordinator must pin the exact public SHA' >&2; exit 1; }
          git init --quiet product
          git -C product remote add origin https://github.com/rock3r/spectre.git
          git -C product fetch --quiet --no-tags --depth=1 origin "$PUBLIC_SHA"
          git -C product checkout --quiet --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = "$PUBLIC_SHA"
          test -z "$(git -C product status --porcelain=v1 --untracked-files=all)"
          printf 'PUBLIC_SHA=%s\nVERSION_NAME=%s\n' "$PUBLIC_SHA" "$VERSION_NAME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/qa-packaged-disabled-atspi"
          git -C product show -s --format='%H %T %cI %s' >"$RUNNER_TEMP/qa-packaged-disabled-atspi/source.txt"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v5
        with:
          build-root-directory: product
          cache-read-only: true
      - name: Install native build and private desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang pkg-config libdbus-1-dev libatspi2.0-dev libpipewire-0.3-dev libspa-0.2-dev libxkbcommon-x11-0 libgtk-3-0t64 gir1.2-gtk-3.0 python3-gi python3-pyatspi at-spi2-core dbus-x11 xvfb x11-utils openbox unzip xauth libxcursor-dev libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libatk-wrapper-java libatk-wrapper-java-jni ffmpeg gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-plugins-good
      - name: Authenticate the successful product ZIP for a smoke-script-only replay
        if: env.REUSE_STOCK_ZIP == 'true'
        working-directory: product
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          original=028401bd37b7576b05196537aaeaf69ef8346575
          git fetch --quiet --no-tags --depth=1 origin "$original"
          if [[ "$PUBLIC_SHA" == "$original" && "$COMPLETE_STOCK" == true ]]; then
            qa="$GITHUB_WORKSPACE/scratch/.github/qa-packaged-disabled-atspi"
            base64 --decode "$qa/complete-stock-0284.diff.b64" > "$RUNNER_TEMP/full-qa.patch"
            echo "7c16ec067fe5adea7337c63f2c878da579d164166a8ec022e919da75c3f2eed1  $RUNNER_TEMP/full-qa.patch" | sha256sum --check --strict
            git apply --index "$RUNNER_TEMP/full-qa.patch"
            tree=$(git write-tree)
            test "$tree" = ff831b117d6f66a005935416c77b25235dbe44ac
            printf '%s\n' "$tree" >"$RUNNER_TEMP/qa-packaged-disabled-atspi/stock-result-tree.txt"
            git diff --cached --name-only "$original" >"$RUNNER_TEMP/qa-packaged-disabled-atspi/replay-source-changes.txt"
          elif [[ "$PUBLIC_SHA" == "$original" ]]; then
            patch="$RUNNER_TEMP/verified-stock-1053.diff"
            base64 --decode "$GITHUB_WORKSPACE/scratch/.github/qa-packaged-disabled-atspi/stock-1053.diff.b64" > "$patch"
            echo "bdc5b16cbbd3666ef2727f8139743a47cec4669eb9a846735c4c46872a7944d3  $patch" | sha256sum --check --strict
            git apply --check --index "$patch"
            git apply --index "$patch"
            tree=$(git write-tree)
            test "$tree" = e7fa72a41fce1cb30ea8ac80fe15d96469474cf4
            if [[ "$ATTACHED_CHECK" == true ]]; then
              attached="$RUNNER_TEMP/attached.patch"
              base64 --decode "$GITHUB_WORKSPACE/scratch/.github/qa-packaged-disabled-atspi/attached-0284.diff.b64" > "$attached"
              echo "9f60bc0aa0974e56eac6cff801460bbc38c64c99a17ed048084db3c18240234a  $attached" | sha256sum --check --strict
              git apply --3way --index "$attached"
              tree=$(git write-tree)
              test "$tree" = f4c712714ec5afed4bccbb5d96cde5766ca51651
            fi
            printf '%s\n' "$tree" >"$RUNNER_TEMP/qa-packaged-disabled-atspi/stock-result-tree.txt"
            git diff --cached --name-only "$original" >"$RUNNER_TEMP/qa-packaged-disabled-atspi/replay-source-changes.txt"
          else
            git diff --name-only "$original" "$PUBLIC_SHA" >"$RUNNER_TEMP/qa-packaged-disabled-atspi/replay-source-changes.txt"
          fi
          test -s "$RUNNER_TEMP/qa-packaged-disabled-atspi/replay-source-changes.txt"
          while IFS= read -r changed; do
            case "$changed" in
              cli/src/test/kotlin/dev/sebastiano/spectre/cli/daemon/DaemonFixtureIntegrationTest.kt|.github/workflows/validation-linux.yml|scripts/release-smoke.py|scripts/smoke_lib.py|scripts/mcp-stdio-smoke.py|.github/scripts/test-release-smoke-scripts.py|docs/*.md) ;;
              *) echo "Package identity cannot be reused across change to: $changed" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/qa-packaged-disabled-atspi/replay-source-changes.txt"
          gh api repos/rock3r/spectre/actions/runs/45876346277 | jq -e '.conclusion == "success" and .head_sha == "6bf966a2358242ddb6f68136a156db6593d2148d"' >/dev/null
          gh api repos/rock3r/spectre/actions/artifacts/15145104173 | jq -e '.workflow_run.id == 45876346277 and .expired == false and .digest == "sha256:05118071ef19d946ef26d95a2966997a57ad0ada7eb9c775f9d58f8d7d92f110"' >/dev/null
          gh api repos/rock3r/spectre/actions/artifacts/15145104173/zip >"$RUNNER_TEMP/previous.zip"
          echo "05118071ef19d946ef26d95a2966997a57ad0ada7eb9c775f9d58f8d7d92f110  $RUNNER_TEMP/previous.zip" | sha256sum --check --strict
          destination=cli/build/construo/distributions/linuxX64
          mkdir -p "$destination"
          unzip -p "$RUNNER_TEMP/previous.zip" spectre-linuxX64.zip > "$destination/spectre-linuxX64.zip"
          echo "c10c60fdb03e233563461084f6d68d35403c036d0fe3621e17d77bd5354569a7  $destination/spectre-linuxX64.zip" | sha256sum --check --strict
      - name: Build and extract the exact 0.10.0 Linux x64 Roast package
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REUSE_STOCK_ZIP" != true ]]; then
            ./gradlew --no-daemon -PVERSION_NAME="$VERSION_NAME" :cli:packageLinuxX64 --console=plain
          fi
          zip=$(find cli/build/construo/distributions/linuxX64 -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$zip"
          unzip -q "$zip" -d "$RUNNER_TEMP/public-package"
          find "$RUNNER_TEMP/public-package" -type f -name spectre -printf '%m %p\n' | tee "$RUNNER_TEMP/qa-packaged-disabled-atspi/launcher-modes.txt"
          cli=$(find "$RUNNER_TEMP/public-package" -type f -name spectre -perm -u+x -print -quit)
          test -n "$cli" && test -x "$cli"
          case "$cli" in "$RUNNER_TEMP/public-package"/*) ;; *) exit 1;; esac
          python3 - "$zip" "$RUNNER_TEMP/qa-packaged-disabled-atspi/archive-identity.json" <<'PY'
          import io, json, struct, sys, zipfile
          archive, output = sys.argv[1:]
          jar_basename = "cli-0.10.0-all.jar"
          helper_name = "native/linux/x86_64/spectre-wayland-helper"
          with zipfile.ZipFile(archive) as outer:
              jars = [item for item in outer.infolist() if item.filename.rsplit("/", 1)[-1] == jar_basename]
              if len(jars) != 1:
                  raise SystemExit(f"expected one {jar_basename} in Roast ZIP, found {[x.filename for x in jars]!r}")
              with zipfile.ZipFile(io.BytesIO(outer.read(jars[0]))) as jar:
                  try:
                      helper = jar.getinfo(helper_name)
                  except KeyError as error:
                      raise SystemExit(f"{helper_name} absent from {jars[0].filename}") from error
                  header = jar.read(helper)[:20]
          machine = struct.unpack_from("<H", header, 18)[0] if header[:4] == b"\x7fELF" and len(header) >= 20 else None
          if machine != 62:
              raise SystemExit(f"packaged helper ELF machine is {machine!r}, expected x86_64 (62)")
          with open(output, "w") as stream:
              json.dump({"outerJar": jars[0].filename, "jarEntry": helper_name, "elfMachine": machine}, stream)
              stream.write("\n")
          PY
          sha256sum "$zip" >"$RUNNER_TEMP/qa-packaged-disabled-atspi/package.sha256"
          "$cli" --version >"$RUNNER_TEMP/qa-packaged-disabled-atspi/version.txt"
          grep -Eq '0\.10\.0' "$RUNNER_TEMP/qa-packaged-disabled-atspi/version.txt"
          printf 'PACKAGED_CLI=%s\n' "$cli" >> "$GITHUB_ENV"
      - name: Retain exact Linux ZIP for an independent consumer retry
        if: env.REUSE_STOCK_ZIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: disabled-atspi-immutable-linux-x64
          path: product/cli/build/construo/distributions/linuxX64/spectre-linuxX64.zip
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Run QA oracle guards
        if: env.REUSE_STOCK_ZIP != 'true'
        run: python3 scratch/.github/qa-packaged-disabled-atspi/test_verify.py -v
      - name: Exercise packaged CLI, daemon, and MCP on a private disabled bus
        if: env.REUSE_STOCK_ZIP != 'true'
        shell: bash
        env:
          QA_DIR: ${{ github.workspace }}/scratch/.github/qa-packaged-disabled-atspi
          QA_ARTIFACTS: ${{ runner.temp }}/qa-packaged-disabled-atspi
        run: dbus-run-session -- scratch/.github/qa-packaged-disabled-atspi/run-session.sh
      - name: Run the unmodified stock AccessKit release-smoke case against the same extracted ZIP
        if: always() && env.PACKAGED_CLI != '' && env.ATTACHED_CHECK != 'true' && !endsWith(github.event.head_commit.message, 'GTK only')
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          unset DISPLAY WAYLAND_DISPLAY DBUS_SESSION_BUS_ADDRESS SPECTRE_DAEMON_SOCKET_DIR SPECTRE_ACCESSIBILITY_HELPER SPECTRE_ACCESSIBILITY_HELPER_PATH SPECTRE_ACCESSIBILITY_SOCKET
          qa="$GITHUB_WORKSPACE/scratch/.github/qa-packaged-disabled-atspi"
          export PYTHONPATH="$qa/observer:$PWD/scripts" QA_RESPONSE_LOG="$RUNNER_TEMP/qa-packaged-disabled-atspi/complete-stock-responses.jsonl"
          if [[ "$COMPLETE_STOCK" == true ]]; then
            test -f /usr/share/java/java-atk-wrapper.jar
            dpkg -L libatk-wrapper-java-jni | grep libatk-wrapper.so | tee "$RUNNER_TEMP/qa-packaged-disabled-atspi/atk-provider.txt"
            provider="$(dpkg -L libatk-wrapper-java-jni | grep -E '/libatk-wrapper\.so$')"
            jni="$(dirname "$provider")"
            cat >"$RUNNER_TEMP/LoadAtk.java" <<'JAVA'
          public class LoadAtk {
              public static void main(String[] args) {
                  System.out.println("java.library.path=" + System.getProperty("java.library.path"));
                  System.loadLibrary("atk-wrapper");
              }
          }
          JAVA
            java --class-path /usr/share/java/java-atk-wrapper.jar "$RUNNER_TEMP/LoadAtk.java" >"$RUNNER_TEMP/qa-packaged-disabled-atspi/raw-atk-loader.txt" 2>&1 || cat "$RUNNER_TEMP/qa-packaged-disabled-atspi/raw-atk-loader.txt"
            export LD_LIBRARY_PATH="$jni${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            ldd "$provider" | tee "$RUNNER_TEMP/qa-packaged-disabled-atspi/atk-provider-dependencies.txt"
            java --class-path /usr/share/java/java-atk-wrapper.jar "$RUNNER_TEMP/LoadAtk.java" >"$RUNNER_TEMP/qa-packaged-disabled-atspi/augmented-atk-loader.txt" 2>&1 || cat "$RUNNER_TEMP/qa-packaged-disabled-atspi/augmented-atk-loader.txt"
            launcher=(xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp')
          else
            launcher=()
          fi
          "${launcher[@]}" python3 - <<'PYTHON' 2>&1 | tee "$RUNNER_TEMP/qa-packaged-disabled-atspi/stock-accesskit-release-cell.log"
          import json, os, runpy, time
          from pathlib import Path
          script = Path('scripts/release-smoke.py').resolve()
          source = runpy.run_path(str(script))
          if os.environ.get('COMPLETE_STOCK') == 'true':
              import stat
              with source['_private_linux_dbus'](True) as probe, source['_private_daemon_environment']() as private:
                  address = probe['DBUS_SESSION_BUS_ADDRESS']
                  kind, endpoint = address.split(',',1)[0].split('=',1)
                  path = Path(endpoint)
                  parent = path.parent.stat()
                  sock = Path(private['SPECTRE_DAEMON_SOCKET_DIR']).stat()
                  print(json.dumps(dict(busType=kind, endpoint=endpoint, currentUid=os.getuid(),
                      endpointPathExists=path.exists(), busParentUid=parent.st_uid,
                      busParentMode=oct(stat.S_IMODE(parent.st_mode)), spectreSocketDirUid=sock.st_uid,
                      spectreSocketDirMode=oct(stat.S_IMODE(sock.st_mode)))), flush=True)
          started = time.monotonic()
          result = source['_accesskit_cli_smoke'](Path(os.environ['PACKAGED_CLI']), os.environ['VERSION_NAME'])
          print(json.dumps({'result':'pass','detail':result,'wallSeconds':round(time.monotonic()-started,3)}))
          PYTHON
      - name: Verify the standalone MCP on the real Rust AccessKit fixture
        if: always() && env.ATTACHED_CHECK == 'true' && env.PACKAGED_CLI != ''
        working-directory: product
        run: |
          set -euo pipefail
          qa="$GITHUB_WORKSPACE/scratch/.github/qa-packaged-disabled-atspi"
          out="$RUNNER_TEMP/qa-packaged-disabled-atspi"
          export PYTHONPATH="$qa/observer" QA_RESPONSE_LOG="$out/standalone-responses.jsonl"
          xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' python3 "$qa/independent-legs.py" standalone 2>&1 | tee "$out/standalone.log"
      - name: Verify the single exact attached CLI and MCP JUnit case
        if: always() && env.ATTACHED_CHECK == 'true' && env.PACKAGED_CLI != ''
        working-directory: product
        run: |
          set -euo pipefail
          qa="$GITHUB_WORKSPACE/scratch/.github/qa-packaged-disabled-atspi"
          out="$RUNNER_TEMP/qa-packaged-disabled-atspi"
          test -f /usr/share/java/java-atk-wrapper.jar
          dpkg -L libatk-wrapper-java-jni | grep libatk-wrapper.so | tee "$out/atk-provider.txt"
          export PYTHONPATH="$qa/observer" QA_RESPONSE_LOG="$out/attached-responses.jsonl"
          xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' python3 "$qa/independent-legs.py" attached 2>&1 | tee "$out/attached.log"
      - name: Require exactly one executed JUnit test and retain full failure output
        if: always() && (env.ATTACHED_CHECK == 'true' || env.COMPLETE_STOCK == 'true') && env.PACKAGED_CLI != ''
        working-directory: product
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qa-packaged-disabled-atspi"
          cp cli/build/test-results/test/TEST-*DaemonFixtureIntegrationTest.xml "$out/"
          python3 - "$out" <<'PYTHON'
          from pathlib import Path
          import sys,xml.etree.ElementTree as ET
          paths=list(Path(sys.argv[1]).glob("TEST-*DaemonFixtureIntegrationTest.xml"))
          assert len(paths)==1, paths
          suite=ET.parse(paths[0]).getroot()
          cases=suite.findall('testcase')
          print(suite.attrib, [c.get('name') for c in cases])
          assert len(cases)==1 and 'packaged CLI and MCP capture an attached JVM' in cases[0].get('name','')
          for failure in cases[0]:
              print(failure.tag, failure.attrib, (failure.text or '')[:7000])
          assert all(suite.get(k) == '0' for k in ['skipped','errors','failures']) and suite.get('tests')=='1'
          PYTHON
      - name: Replay the exact Java fixture startup without the added JNI search directory
        if: always() && env.COMPLETE_STOCK == 'true' && env.PACKAGED_CLI != ''
        working-directory: product
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qa-packaged-disabled-atspi"
          export QA_EVIDENCE="$out"
          if ! test -e "$out/fixture-command.json"; then
            echo 'Attached fixture did not reach its MCP launcher; raw JVM loader diagnostics retained.'
            exit 0
          fi
          xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' env PYTHONPATH="$PWD/scripts" python3 - <<'PYTHON'
          import json,os,runpy,signal,subprocess
          from pathlib import Path
          evidence=Path(os.environ['QA_EVIDENCE'])
          command=json.loads((evidence/'fixture-command.json').read_text())
          assert command['argv'][-1]=='dev.sebastiano.spectre.agent.fixture.ComposeFixtureMainKt'
          source=runpy.run_path(str(Path('scripts/release-smoke.py').resolve()))
          with source['_private_linux_dbus'](True) as bus, source['_private_daemon_environment']() as private:
              env={**os.environ,**bus,**private,'SPECTRE_FIXTURE_ATSPI':'true'}
              with (evidence/'stock-jvm-fixture-start.log').open('w') as output:
                  app=subprocess.Popen(command['argv'], cwd=command['cwd'], env=env, stdout=output,
                      stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      print('Unmodified fixture process exit code:',app.wait(timeout=35))
                  except subprocess.TimeoutExpired:
                      print('Unmodified fixture process continued after 35 s; retaining its output.')
                  finally:
                      source['_terminate_owned_process'](app)
          print((evidence/'stock-jvm-fixture-start.log').read_text()[-5000:])
          PYTHON
      - name: Upload compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-disabled-atspi-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-packaged-disabled-atspi
          if-no-files-found: error
          retention-days: 14
