name: Verify Jammy GNOME public region stills
on:
  push:
    branches: [release-0.10/gnome-hosted-smoke]
    paths:
      - .github/workflows/gnome-jammy-smoke.yml
      - .github/scripts/gnome-cli-recording-live.py
      - .github/scripts/gnome-cli-region-stills.py
      - .github/scripts/gnome-hosted-smoke-session.sh
      - .github/verification/wayland-cli-region-stills/**
permissions:
  contents: read
jobs:
  jammy-gnome:
    name: ${{ matrix.os }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        mode: [cli-region-stills]
    timeout-minutes: 55
    steps:
      - name: Check out temporary workflow tooling
        uses: actions/checkout@v6
        with:
          path: smoke-tooling
          persist-credentials: false

      - name: Check out the release candidate
        uses: actions/checkout@v6
        with:
          ref: 7d1c27a716a95d502d6e90daf684514bc82623dc
          persist-credentials: false
          path: candidate

      - name: Verify the immutable public GNOME candidate
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = 7d1c27a716a95d502d6e90daf684514bc82623dc
          test "$(git write-tree)" = c2bdbe1c9aa55eb536ee727231d0e33877fbcafd
          test -z "$(git status --porcelain)"

      - name: Set up JDK 21 for the project toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-root-directory: candidate

      - name: Run installed CLI and public recording API on the attended GNOME seat
        env:
          ATSPI_REPO: unused
          FIXTURE_CHECKOUT: unused
          SMOKE_MODE: ${{ matrix.mode }}
          CANDIDATE_SHA: 7d1c27a716a95d502d6e90daf684514bc82623dc
          SMOKE_ARTIFACTS: ${{ runner.temp }}/gnome-cli-recording-live
          SMOKE_REPO: ${{ github.workspace }}/candidate
          SMOKE_SESSION_SCRIPT: ${{ github.workspace }}/smoke-tooling/.github/scripts/gnome-hosted-smoke-session.sh
        run: |
          export SMOKE_USER="$(id -un)" RUST_BIN="$(dirname "$(command -v cargo)")"
          sudo --preserve-env=ATSPI_REPO,FIXTURE_CHECKOUT,SMOKE_MODE,SMOKE_USER,RUST_BIN,CANDIDATE_SHA,JAVA_HOME,SMOKE_ARTIFACTS,SMOKE_REPO,SMOKE_SESSION_SCRIPT .github/scripts/gnome-hosted-smoke.sh "$JAVA_HOME"
        working-directory: smoke-tooling

      - name: Record Jammy distribution and component versions
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/gnome-cli-recording-live"
          mkdir -p "$out"
          cat /etc/os-release > "$out/host-os-release.txt"
          dpkg-query -W gnome-shell mutter pipewire gstreamer1.0-pipewire xdg-desktop-portal-gnome > "$out/host-versions.txt" || true
          gnome-shell --version > "$out/shell-version.txt" || true

      - name: Upload CLI and recording live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gnome-${{ matrix.os }}-${{ matrix.mode }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gnome-cli-recording-live/
          if-no-files-found: error
          retention-days: 7
